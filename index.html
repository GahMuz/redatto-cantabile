<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>L’Arbre des Rois — Lecture</title>
  <style>
    :root { color-scheme: light; --paper: #faf7f0; --ink: #292c27; --muted: #696b60; --line: #ddd9cc; --accent: #516149; --panel: #f0eee4; --reading-size: 20px; }
    :root.dark { color-scheme: dark; --paper: #20251f; --ink: #e9e6dc; --muted: #b4b7a9; --line: #444a3f; --accent: #bdcba6; --panel: #2b3128; }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: Georgia, 'Times New Roman', serif; }
    a { color: var(--accent); text-underline-offset: .25em; }
    a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 5px; }
    .skip { position: absolute; top: -100px; padding: 12px; background: var(--paper); }
    .skip:focus { top: 10px; z-index: 10; }
    .layout { max-width: 1200px; margin: auto; display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 70px; padding: 48px 32px; }
    aside { position: sticky; top: 36px; align-self: start; }
    .eyebrow, .status, nav, button, .chapter-footer, .pager, .note { font-family: system-ui, sans-serif; }
    .eyebrow { font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
    h1 { font-size: 32px; font-weight: normal; line-height: 1.15; margin: 18px 0; }
    .note { font-size: 13px; line-height: 1.6; color: var(--muted); }
    nav { display: grid; gap: 6px; margin: 30px 0; }
    nav a { display: block; padding: 12px; border-radius: 5px; text-decoration: none; font-size: 14px; }
    nav a span { color: var(--muted); margin-right: 12px; font-size: 12px; }
    nav a:hover, nav a[aria-current="page"] { background: var(--panel); }
    .tools { display: flex; flex-wrap: wrap; gap: 8px; border-top: 1px solid var(--line); padding-top: 22px; }
    button { cursor: pointer; background: transparent; color: var(--ink); border: 1px solid var(--line); border-radius: 5px; padding: 9px 12px; font-size: 13px; }
    button:hover { background: var(--panel); }
    button:disabled { opacity: .45; cursor: default; }
    [hidden] { display: none !important; }
    main { min-width: 0; max-width: 700px; }
    .chapter-header { border-bottom: 1px solid var(--line); padding: 24px 0 32px; margin-bottom: 44px; }
    h2 { font-size: clamp(32px, 5vw, 48px); font-weight: normal; line-height: 1.15; margin: 14px 0; }
    .status { font-size: 12px; color: var(--muted); line-height: 1.6; }
    .prose { font-size: var(--reading-size); line-height: 1.8; overflow-wrap: anywhere; }
    .prose p { margin: 0 0 1.05em; }
    hr { border: 0; text-align: center; margin: 2.8em 0; color: var(--muted); }
    hr::after { content: '⁂'; font-size: 24px; }
    .chapter-footer { border-top: 1px solid var(--line); margin-top: 48px; padding: 24px 0; font-size: 12px; }
    .pager { display: flex; justify-content: space-between; gap: 20px; margin: 32px 0; font-size: 14px; }
    @media (max-width: 800px) {
      .layout { display: block; padding: 24px 22px; }
      aside { position: static; margin-bottom: 32px; }
      h1 { font-size: 28px; }
      nav { margin: 20px 0; }
      .chapter-header { padding-top: 8px; }
      main { margin: auto; }
    }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
    @media print {
      :root, :root.dark { --paper: white; --ink: black; --muted: #555; --line: #ccc; --reading-size: 12pt; }
      aside, .pager, .chapter-footer, .skip { display: none; }
      .layout { display: block; padding: 0; }
      main { max-width: none; }
      article { break-before: page; }
    }
  </style>
</head>
<body>
  <a class="skip" href="#lecture">Aller au texte</a>
  <div class="layout">
    <aside id="sommaire">
      <p class="eyebrow">L'atelier du roman</p>
      <h1>L’Arbre<br>des Rois</h1>
      <p class="note"><span id="chapter-count">Chargement du sommaire…</span><br>Statut indiqué au début de chaque chapitre.</p>
      <nav aria-label="Chapitres">

      </nav>
      <div class="tools" hidden>
        <button id="smaller" type="button" aria-label="Réduire la taille du texte">A−</button>
        <button id="larger" type="button" aria-label="Agrandir la taille du texte">A+</button>
        <button id="theme" type="button" aria-pressed="false">Mode sombre</button>
      </div>
      <p class="note">Lecture des fichiers du manuscrit actif.</p>
    </aside>
    <main id="lecture">
      <p id="message" class="note" role="status">Chargement du manuscrit…</p>
      <button id="retry" type="button" hidden>Réessayer</button>
      <article id="chapter" hidden aria-labelledby="chapter-title">
        <header class="chapter-header">
          <p id="chapter-number" class="eyebrow"></p>
          <h2 id="chapter-title" tabindex="-1"></h2>
          <p id="chapter-status" class="status"></p>
        </header>
        <div id="chapter-text" class="prose"></div>
        <footer class="chapter-footer"><a id="chapter-source">Texte source du chapitre</a> · <a href="#sommaire">Sommaire</a></footer>
      </article>
      <noscript><p>Activer JavaScript pour charger les chapitres, ou consulter <a href="manuscrit/index.md">l’index du manuscrit</a>.</p></noscript>
      <nav class="pager" aria-label="Suite de la lecture" hidden>
        <a id="previous">← Chapitre précédent</a>
        <a id="next">Chapitre suivant →</a>
      </nav>
    </main>
  </div>
  <script src="lecture/lecteur.js" defer></script>
</body>
</html>
